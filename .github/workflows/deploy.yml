# Builds the site and publishes it to GitHub Pages (nwanext.com).
# Runs on every push to main (CMS saves and synced stories land as commits) and once a day,
# so "upcoming" and "this week" stay right with no new commits.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '15 10 * * *' # 4:15 AM Central (5:15 during daylight time)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          TZ: America/Chicago
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
